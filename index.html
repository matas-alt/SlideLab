<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10263b">
<title>SlideLab Lite｜手機簡報排版練習室</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:#f0f4f8;color:#1d3047;font-synthesis:none}
*{box-sizing:border-box}body{margin:0;min-height:100dvh}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,input:focus-visible{outline:3px solid #70b4fd;outline-offset:2px}
header{background:#10263b;color:white;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px max(13px,env(safe-area-inset-left));position:relative;z-index:3}
.brand{font-size:19px;font-weight:850;letter-spacing:-.4px}.brand small{display:block;font-size:11px;font-weight:450;color:#b3cada;letter-spacing:0;margin-top:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid #d5e0ea;background:white;color:#193a56;min-height:40px;padding:9px 13px;border-radius:11px;font-weight:700;font-size:13px}
.btn.blue{background:#227be1;color:white;border-color:#227be1}.btn.red{color:#a62934;background:#fff6f6;border-color:#f0cbcc}.btn.pale{background:#eaf4fc;color:#23619b;border-color:#cde6f8}
main{max-width:1110px;margin:auto;padding:14px 14px 40px}
.workspace{background:#fff;border:1px solid #dce5ee;border-radius:17px;overflow:hidden;box-shadow:0 8px 30px #183b6110}
.projectline{padding:11px 15px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #e7edf4}
#projectTitle{background:#f6f9fc;border:1px solid #dfe7ee;color:#19334b;border-radius:9px;padding:9px 10px;min-width:0;flex:1;max-width:510px;font-size:14px;font-weight:730}
#saveState{margin-left:auto;color:#667f93;font-size:11px;white-space:nowrap}
.stagearea{padding:16px;background:#e6eef6}
#canvasWrap{position:relative;width:100%;aspect-ratio:16/9;background:white;box-shadow:0 7px 24px #142a4b40;overflow:hidden;border-radius:2px;user-select:none;-webkit-user-select:none}
#artboard{position:absolute;top:0;left:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;isolation:isolate}
.obj{position:absolute;overflow:hidden}.imageBox{touch-action:none;cursor:crosshair}.imageBox .imageInside{position:absolute;max-width:none!important;pointer-events:none;-webkit-user-drag:none}.imageBox .placeholder{position:absolute;inset:0;background:linear-gradient(135deg,#dce9f1,#b9d0de);display:grid;place-content:center;text-align:center;color:#386180;font-weight:700;font-size:28px;gap:10px;cursor:pointer}
.textBox{overflow:hidden;touch-action:auto}.textInput{width:100%;height:100%;outline:none;padding:0;margin:0;overflow:hidden;white-space:pre-wrap;overflow-wrap:anywhere;word-break:normal;cursor:text;user-select:text;-webkit-user-select:text;-webkit-touch-callout:default;caret-color:#1567d4;line-height:1.22;touch-action:auto}.textInput:focus{outline:none}
.textBox{display:flex}.textInput{width:100%;min-height:0}.palette{display:grid;grid-template-columns:repeat(2,28px);gap:5px;align-items:center}.swatch{height:27px;width:27px;border:2px solid #d1dce6;border-radius:5px;padding:0;position:relative}.swatch.on{outline:2px solid #1680ed;outline-offset:1px}.control-group{display:flex;gap:5px;align-items:center;flex-wrap:wrap;border-right:1px solid #dbe6f0;padding-right:8px}.control-group:last-child{border-right:0}.control-label{font-size:12px;color:#45637b;font-weight:700}.alignGrid{display:grid;grid-template-columns:repeat(3,36px);gap:4px}.alignGrid .mini{min-width:0;min-height:36px;padding:2px}.palettePanel{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.opacityField{width:130px;height:34px;padding:0;accent-color:#227be1}.opacityValue{display:inline-block;min-width:38px;font-size:12px;color:#35526b;font-weight:700}.layoutgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.iconbtn{display:flex;align-items:center;justify-content:center;background:#fff}.iconbtn svg{display:block}.iconbtn.on svg .active{fill:#227be1}.iconbtn .stroke{stroke:#5d7083;stroke-width:2.2;stroke-linecap:round}.iconbtn .fill{fill:#5d7083}.iconbtn .active{fill:#227be1;stroke:#227be1}
#selection{position:absolute;border:2px solid #1680ed;pointer-events:none;z-index:5;display:none}
.handle{position:absolute;width:24px;height:24px;border:2px solid #1680ed;border-radius:6px;background:white;box-shadow:0 2px 6px #0c478c30;transform:translate(-50%,-50%);pointer-events:auto;touch-action:none;cursor:nwse-resize}
.handle.tr{cursor:nesw-resize}.handle.bl{cursor:nesw-resize}.handle.tl{left:0;top:0}.handle.tr{left:100%;top:0}.handle.br{left:100%;top:100%}.handle.bl{left:0;top:100%}
#moveGrip{position:absolute;left:50%;top:-1px;transform:translate(-50%,-100%);min-width:72px;height:31px;background:#1680ed;color:white;border:0;border-radius:9px 9px 0 0;font-size:13px;font-weight:750;pointer-events:auto;touch-action:none;cursor:move;display:flex;align-items:center;justify-content:center;gap:3px;white-space:nowrap}
#selection.insideTop #moveGrip{top:0;transform:translate(-50%,0);border-radius:0 0 9px 9px}
.stagenote{display:flex;justify-content:space-between;gap:8px;margin-top:11px;font-size:12px;color:#63788b}
.tools{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:12px 14px;border-bottom:1px solid #e5ecf3}
.tool{border:1px solid #d5e2ef;background:#f3f9ff;color:#285e90;border-radius:10px;min-height:42px;padding:9px 13px;font-size:13px;font-weight:750;white-space:nowrap}
.tool.primary{background:#dff1ed;border-color:#bfe6dd;color:#20655e}.tool.active{background:#d7ecff;border-color:#90c5fc}
#textControls{display:none;align-items:center;gap:8px;flex-wrap:wrap;padding:11px 14px;background:#f9fbff;border-bottom:1px solid #e6edf5;font-size:13px}
#textControls.visible{display:flex}#textControls label{font-size:12px;color:#45637b;font-weight:700}.formatSize{width:78px;min-height:36px;border:1px solid #d3e0eb;border-radius:8px;padding:6px;background:white;color:#19344e}
#textColor{height:36px;width:45px;padding:3px;background:white;border:1px solid #d2e0ee;border-radius:8px}.mini{min-width:37px;min-height:36px;padding:6px 9px;border:1px solid #d3e0eb;background:white;color:#22415e;border-radius:8px;font-weight:750}.mini.on{background:#d3e9ff;border-color:#70aeec}
#imageControls{display:none;align-items:center;gap:9px;flex-wrap:wrap;padding:10px 14px;background:#f9fbff;border-bottom:1px solid #e6edf5;font-size:12px;color:#425e76}#imageControls.visible{display:flex}
#zoom{width:125px;accent-color:#227be1}
.deckhead{display:flex;justify-content:space-between;align-items:center;gap:7px;padding:14px 15px 9px}.deckhead h2{font-size:15px;margin:0}.deckhead span{font-size:12px;color:#60788d}
#filmstrip{display:flex;gap:9px;overflow-x:auto;padding:0 15px 15px;scrollbar-width:thin;scroll-snap-type:x proximity}
.slideTile{flex:none;width:124px;scroll-snap-align:start}.thumb{width:124px;height:72px;border-radius:8px;border:2px solid #ccdae7;overflow:hidden;padding:0;display:block;background:#fff}.thumb.current{border:3px solid #2480eb;box-shadow:0 0 0 2px #c5e0ff}.thumb canvas{display:block;width:100%;height:100%}.slideCaption{text-align:center;font-size:11px;color:#537087;margin-top:6px}.newTile{flex:none;width:115px;height:72px;border:2px dashed #9bc2e4;border-radius:9px;background:#f2faff;color:#2a6899;font-size:13px;font-weight:750}
.footrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 15px 16px}.tip{font-size:11px;color:#637f93;line-height:1.55}
.modalBackdrop{position:fixed;inset:0;background:#10243cb3;z-index:20;display:none;place-items:center;padding:15px}.modalBackdrop.show{display:grid}
.dialog{background:white;border-radius:16px;padding:18px;width:min(580px,100%);max-height:88dvh;overflow:auto}.dialoghead{display:flex;align-items:center;justify-content:space-between;gap:7px;margin-bottom:10px}.dialoghead h2{font-size:19px;margin:0}.dialog p{font-size:12px;color:#61788c;line-height:1.6}
.layoutgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}.layoutOption{border:1px solid #d6e5f1;background:#f7fbff;padding:8px;border-radius:11px;text-align:left;white-space:normal}.layoutOption svg{display:block;width:100%;border:1px solid #e0e5ed;border-radius:5px}.layoutOption b{font-size:13px;display:block;margin-top:8px}.layoutOption span{font-size:11px;color:#60788d;display:block;margin-top:3px}
#toast{position:fixed;z-index:30;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#123653;color:white;border-radius:10px;padding:10px 14px;font-size:13px;max-width:90vw;text-align:center;pointer-events:none;opacity:0;transition:opacity .2s;box-shadow:0 8px 22px #122f4960}#toast.show{opacity:1}
.hiddenFile{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
@media(max-width:650px){header{padding:10px 12px}.brand{font-size:17px}.brand small{font-size:10px}.btn{padding:8px 10px;min-height:38px}.stagearea{padding:10px 7px}.stagenote{padding:0 3px;font-size:11px}.tools{padding:10px;gap:7px}.tool{flex:1;min-width:83px;padding:9px 8px;font-size:12px}main{padding:9px 7px 22px}.workspace{border-radius:12px}.projectline{padding:9px 10px}.layoutgrid{gap:7px}.layoutOption{padding:5px}.layoutOption b{font-size:12px}.layoutOption span{font-size:10px}#saveState{font-size:10px}#moveGrip{height:29px}#textControls,#imageControls{padding:9px 10px}}
</style>
</head>
<body>
<header><div class="brand">SlideLab <span style="font-weight:450;color:#b3cada;font-size:13px">Lite</span><small>全圖像 · 半圖文 · 大字流</small></div><button class="btn blue" id="exportBtn">↓ 匯出 PDF</button></header>
<main><section class="workspace">
 <div class="projectline"><input id="projectTitle" aria-label="簡報名稱" maxlength="70" value="我的簡報練習"><span id="saveState" aria-live="polite">準備就緒</span></div>
 <div class="stagearea"><div id="canvasWrap"><div id="artboard" aria-label="16 比 9 投影片編輯畫布"></div><div id="selection"><button type="button" id="moveGrip" aria-label="拖曳移動整個物件">✥ 移動</button><div class="handle tl" data-handle="tl" aria-label="調整左上角"></div><div class="handle tr" data-handle="tr" aria-label="調整右上角"></div><div class="handle br" data-handle="br" aria-label="調整右下角"></div><div class="handle bl" data-handle="bl" aria-label="調整左下角"></div></div></div><div class="stagenote"><span id="pageCount">第 1 / 1 頁</span><span id="stageHelp">點選文字直接編輯；拖四角調大小</span></div></div>
 <div class="tools"><button class="tool primary" id="addSlideBtn">＋ 新增頁</button><button class="tool" id="addImageBtn">▧ 插入圖片</button><button class="tool" id="addTextBtn">T＋ 插入文字</button><button class="tool" id="deleteObjBtn" style="display:none">刪除物件</button></div>
 <div id="textControls"><label for="fontSize">字級</label><input class="formatSize" type="number" id="fontSize" min="12" max="220" step="1" aria-label="字體大小"><button class="mini" type="button" id="boldBtn" title="切換粗體">B</button><input type="color" id="textColor" title="文字顏色" aria-label="文字顏色"><div class="control-group"><span class="control-label">文字水平</span><div class="alignGrid"><button class="mini iconbtn" id="alignLeft" title="文字置左" aria-label="文字置左"><svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect x="2.5" y="2.5" width="21" height="21" rx="4" fill="none" stroke="#b8c8d7"/><line class="active" x1="5.5" y1="7" x2="16.5" y2="7"/><line class="stroke" x1="5.5" y1="11" x2="18.5" y2="11"/><line class="stroke" x1="5.5" y1="15" x2="15.5" y2="15"/><line class="stroke" x1="5.5" y1="19" x2="19.5" y2="19"/></svg></button><button class="mini iconbtn" id="alignCenter" title="文字置中" aria-label="文字置中"><svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect x="2.5" y="2.5" width="21" height="21" rx="4" fill="none" stroke="#b8c8d7"/><line class="stroke" x1="7" y1="7" x2="18" y2="7"/><line class="active" x1="5" y1="11" x2="21" y2="11"/><line class="stroke" x1="8" y1="15" x2="18" y2="15"/><line class="stroke" x1="6" y1="19" x2="20" y2="19"/></svg></button><button class="mini iconbtn" id="alignRight" title="文字置右" aria-label="文字置右"><svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect x="2.5" y="2.5" width="21" height="21" rx="4" fill="none" stroke="#b8c8d7"/><line class="stroke" x1="9.5" y1="7" x2="20.5" y2="7"/><line class="stroke" x1="7.5" y1="11" x2="20.5" y2="11"/><line class="active" x1="10.5" y1="15" x2="20.5" y2="15"/><line class="stroke" x1="6.5" y1="19" x2="20.5" y2="19"/></svg></button></div></div><div class="control-group"><span class="control-label">文字垂直</span><div class="alignGrid"><button class="mini iconbtn" id="valignTop" title="文字置上" aria-label="文字置上"><svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect x="2.5" y="2.5" width="21" height="21" rx="4" fill="none" stroke="#b8c8d7"/><rect class="active" x="5" y="6" width="2.5" height="11" rx="1"/><line class="stroke" x1="10" y1="7" x2="20" y2="7"/><line class="stroke" x1="10" y1="11" x2="20" y2="11"/><line class="stroke" x1="10" y1="15" x2="18" y2="15"/></svg></button><button class="mini iconbtn" id="valignMiddle" title="文字置中" aria-label="文字置中"><svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect x="2.5" y="2.5" width="21" height="21" rx="4" fill="none" stroke="#b8c8d7"/><rect class="active" x="5" y="8" width="2.5" height="11" rx="1"/><line class="stroke" x1="10" y1="9" x2="20" y2="9"/><line class="stroke" x1="10" y1="13" x2="20" y2="13"/><line class="stroke" x1="10" y1="17" x2="18" y2="17"/></svg></button><button class="mini iconbtn" id="valignBottom" title="文字置下" aria-label="文字置下"><svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect x="2.5" y="2.5" width="21" height="21" rx="4" fill="none" stroke="#b8c8d7"/><rect class="active" x="5" y="10" width="2.5" height="11" rx="1"/><line class="stroke" x1="10" y1="11" x2="20" y2="11"/><line class="stroke" x1="10" y1="15" x2="20" y2="15"/><line class="stroke" x1="10" y1="19" x2="18" y2="19"/></svg></button></div></div><div class="control-group palettePanel"><span class="control-label">文字框底色</span><div class="palette" id="backgroundPalette"></div><label class="control-label" for="bgOpacity">透明度</label><input class="opacityField" id="bgOpacity" type="range" min="0" max="100" step="5" value="0" aria-label="文字框底色透明度"><span class="opacityValue" id="bgOpacityValue">0%</span></div><span class="tip">反白後設定可只改選取文字</span></div>
 <div id="positionControls" style="display:none;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;background:#eef6fc;border-bottom:1px solid #e6edf5"><span class="control-label">物件位置</span><div class="alignGrid" id="objectGrid"></div><span class="tip">對齊整個圖片框／文字框，並非框內內容</span></div>
 <div id="imageControls"><button class="btn pale" id="replaceImageBtn">更換圖片</button><label for="zoom">內容縮放</label><input id="zoom" type="range" min="1" max="3" step="0.05" value="1"><span id="zoomValue">100%</span><span class="tip">拖圖片＝移動裁切；拖「✥ 移動」＝移動外框</span></div>
 <div class="deckhead"><h2>投影片</h2><span id="totalPages">共 1 頁（不限頁數）</span></div><div id="filmstrip" aria-label="投影片列表"></div>
 <div class="footrow"><span class="tip">作品會暫存於這台手機的瀏覽器，並非雲端備份。</span><button class="btn red" id="deleteSlideBtn">刪除本頁</button></div>
</section></main>
<input type="file" class="hiddenFile" id="imageFile" accept="image/*">
<div id="layoutModal" class="modalBackdrop" role="dialog" aria-modal="true" aria-label="選擇新版型"><div class="dialog"><div class="dialoghead"><h2>新增投影片</h2><button class="btn" id="cancelLayout">關閉 ×</button></div><p>選擇一種排版方式，會在目前投影片後面新增一頁。</p><div class="layoutgrid">
<button class="layoutOption" data-layout="blank"><svg viewBox="0 0 160 90"><rect width="160" height="90" fill="white"/><rect x="1" y="1" width="158" height="88" fill="none" stroke="#dfe6ed" stroke-width="2"/></svg><b>完全空白</b><span>白色背景，自行加入文字與圖片</span></button>
<button class="layoutOption" data-layout="full"><svg viewBox="0 0 160 90"><rect width="160" height="90" fill="#4b7995"/><path d="M0 68L41 26l39 37 32-26 48 46v7H0" fill="#aacbd7"/><rect x="10" y="68" width="118" height="7" rx="2" fill="white"/></svg><b>全圖像</b><span>圖片滿版＋短句</span></button>
<button class="layoutOption" data-layout="split"><svg viewBox="0 0 160 90"><rect width="160" height="90" fill="#f4f6f7"/><rect width="76" height="90" fill="#85a8ba"/><path d="M0 75l31-43 40 43" fill="#c1d9df"/><rect x="90" y="30" width="61" height="9" rx="2" fill="#234964"/><rect x="90" y="49" width="51" height="5" rx="2" fill="#98aebc"/><rect x="90" y="61" width="55" height="5" rx="2" fill="#98aebc"/></svg><b>半圖文</b><span>左圖右文</span></button>
<button class="layoutOption" data-layout="big"><svg viewBox="0 0 160 90"><rect width="160" height="90" fill="#f2f0e9"/><rect x="13" y="28" width="125" height="22" rx="2" fill="#244561"/><rect x="15" y="61" width="83" height="5" rx="2" fill="#8299a7"/></svg><b>大字流</b><span>大字＋輔助短句</span></button>
</div></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
(()=>{'use strict';
const W=1280,H=720,$=id=>document.getElementById(id),clamp=(v,min,max)=>Math.min(Math.max(v,min),max),uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-3);
const stage=$('artboard'),wrap=$('canvasWrap'),sel=$('selection'),toastEl=$('toast');
const esc=t=>String(t).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
const text=(html,x,y,w,h,size=66,color='#1c3b53',bold=false,align='left')=>({id:uid(),type:'text',html,x,y,w,h,size,color,bold,align,valign:'top',boxBg:'#ffffff',boxOpacity:0});
const photo=(x,y,w,h)=>({id:uid(),type:'image',src:'',x,y,w,h,panX:0,panY:0,zoom:1});
function template(name){let bg='#ffffff',items=[];
 if(name==='full'){bg='#53718b';items=[photo(0,0,W,H),text('一句話說清楚重點',68,523,1100,126,79,'#ffffff',true)];}
 if(name==='split'){bg='#f7f9fa';items=[photo(0,0,615,H),text('圖像與文字的平衡',679,170,542,187,70,'#203b51',true),text('把重要資訊留在投影片上，其他交給口語說明。',684,398,520,164,36,'#557084')];}
 if(name==='big'){bg='#f6f4ed';items=[text('少，就是多。',88,221,1100,244,125,'#193752',true),text('讓觀眾一眼看見真正的重點',96,510,1085,95,36,'#657f8f')];}
 return{id:uid(),name,bg,objects:items};}
let project={title:'我的簡報練習',slides:[template('blank')]},active=0,selected=null,gesture=null,textSelection=null,imgLoad=new Map(),saveTimer=0,toastTimer=0,db=null,suppressThumb=false;
const current=()=>project.slides[active],object=()=>current()?.objects.find(o=>o.id===selected),scale=()=>wrap.clientWidth/W;
function toast(t){toastEl.textContent=t;toastEl.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove('show'),2700)}
function rgba(hex,opacity){hex=safeColor(hex,'#ffffff');return `rgba(${parseInt(hex.slice(1,3),16)},${parseInt(hex.slice(3,5),16)},${parseInt(hex.slice(5,7),16)},${clamp(Number(opacity)||0,0,1)})`}
function safeColor(v,f='#1c3b53'){return /^#[0-9a-f]{6}$/i.test(v||'')?v:f}
function validSize(v){return clamp(Number(v)||64,12,220)}

function segmentsFromHTML(html,base){let root=document.createElement('template');root.innerHTML=cleanHTML(html);let out=[];function walk(node,style){if(node.nodeType===3){out.push({text:node.nodeValue,style:{...style}});return}if(node.nodeType!==1)return;const tag=node.tagName.toLowerCase();if(tag==='br'){out.push({text:'\n',style:{...style}});return}const next={...style};if(['strong','b'].includes(tag))next.bold=true;if(node.style.fontSize)next.size=validSize(parseFloat(node.style.fontSize));if(node.style.color)next.color=node.style.color;if(node.style.fontWeight==='700'||node.style.fontWeight==='bold')next.bold=true;if(tag==='div'&&out.length&&out[out.length-1].text!=='\n')out.push({text:'\n',style:{...style}});node.childNodes.forEach(n=>walk(n,next))}root.content.childNodes.forEach(n=>walk(n,base));return out}
function renderText(ctx,o){ctx.save();ctx.fillStyle=rgba(o.boxBg||'#ffffff',o.boxOpacity||0);ctx.fillRect(o.x,o.y,o.w,o.h);ctx.beginPath();ctx.rect(o.x,o.y,o.w,o.h);ctx.clip();const runs=segmentsFromHTML(o.html,{size:o.size,color:o.color,bold:o.bold});let lines=[],curr=[],width=0,maxSize=o.size;function push(){lines.push({runs:curr,width,height:maxSize*1.22});curr=[];width=0;maxSize=o.size}for(const run of runs){for(const char of [...run.text]){if(char==='\n'){push();continue}ctx.font=`${run.style.bold?'700':'400'} ${run.style.size}px system-ui,"Noto Sans TC",sans-serif`;let cw=ctx.measureText(char).width;if(width+cw>o.w&&curr.length)push();curr.push({char,w:cw,style:run.style});width+=cw;maxSize=Math.max(maxSize,run.style.size)}}push();let contentHeight=lines.reduce((n,l)=>n+l.height,0);let y=o.y+((o.valign==='middle')?Math.max(0,(o.h-contentHeight)/2):(o.valign==='bottom')?Math.max(0,o.h-contentHeight):0);for(const l of lines){let x=o.x+(o.align==='center'?(o.w-l.width)/2:o.align==='right'?o.w-l.width:0);for(const v of l.runs){ctx.font=`${v.style.bold?'700':'400'} ${v.style.size}px system-ui,"Noto Sans TC",sans-serif`;ctx.fillStyle=v.style.color||o.color;ctx.textBaseline='top';ctx.fillText(v.char,x,y);x+=v.w}y+=l.height;if(y>o.y+o.h)break}ctx.restore()}

function download(blob,file){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=file;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}
function rawJpeg(url){let raw=atob(url.split(',')[1]),bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);return bytes}
function buildPdf(jpgs){const enc=new TextEncoder(),chunks=[],offs=[0];let size=0;const add=d=>{const u=typeof d==='string'?enc.encode(d):d;chunks.push(u);size+=u.length};const obj=(id,fn)=>{offs[id]=size;add(`${id} 0 obj\n`);fn();add('endobj\n')};add('%PDF-1.4\n');obj(1,()=>add('<< /Type /Catalog /Pages 2 0 R >>\n'));obj(2,()=>add(`<< /Type /Pages /Kids [${jpgs.map((_,i)=>`${i*3+3} 0 R`).join(' ')}] /Count ${jpgs.length} >>\n`));jpgs.forEach((jpg,i)=>{const page=i*3+3,img=page+1,content=page+2;obj(page,()=>add(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 960 540] /Resources << /XObject << /Im0 ${img} 0 R >> >> /Contents ${content} 0 R >>\n`));obj(img,()=>{add(`<< /Type /XObject /Subtype /Image /Width 1280 /Height 720 /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n`);add(jpg);add('\nendstream\n')});let commands='q\n960 0 0 540 0 0 cm\n/Im0 Do\nQ\n';obj(content,()=>{add(`<< /Length ${enc.encode(commands).length} >>\nstream\n`);add(commands);add('endstream\n')})});const start=size;add(`xref\n0 ${jpgs.length*3+3}\n0000000000 65535 f \n`);for(let i=1;i<jpgs.length*3+3;i++)add(`${String(offs[i]).padStart(10,'0')} 00000 n \n`);add(`trailer\n<< /Size ${jpgs.length*3+3} /Root 1 0 R >>\nstartxref\n${start}\n%%EOF`);return new Blob(chunks,{type:'application/pdf'})}
async function loadImages(){const arr=[...new Set(project.slides.flatMap(s=>s.objects.filter(o=>o.type==='image'&&o.src).map(o=>o.src)))];await Promise.all(arr.map(src=>new Promise(resolve=>{let im=imageInfo(src)||imgLoad.get(src);if(!im){resolve();return}if(im.complete){resolve();return}im.addEventListener('load',resolve,{once:true});im.addEventListener('error',resolve,{once:true})})))}
async function exportPDF(){blurEditor();const btn=$('exportBtn');btn.disabled=true;btn.textContent='正在產生 PDF…';try{await loadImages();const imgs=[];for(let i=0;i<project.slides.length;i++){const cv=document.createElement('canvas');cv.width=W;cv.height=H;drawSlide(cv.getContext('2d'),project.slides[i]);imgs.push(rawJpeg(cv.toDataURL('image/jpeg',.89)));if(i%3===2)await new Promise(r=>setTimeout(r,0));btn.textContent=`PDF ${i+1}/${project.slides.length}`;}const pdf=buildPdf(imgs);download(pdf,nameFile(project.title)+'.pdf');toast(`已匯出 ${project.slides.length} 頁 PDF`)}catch(err){console.error(err);toast('匯出失敗：'+err.message)}finally{btn.disabled=false;btn.textContent='↓ 匯出 PDF'}}
$('exportBtn').onclick=exportPDF;
const DB='slidelab_lite_v1';function dbOpen(){return new Promise((resolve,reject)=>{if(!indexedDB){reject(Error('不支援資料庫'));return}const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore('saved');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function dbGet(){return new Promise((resolve,reject)=>{const r=db.transaction('saved','readonly').objectStore('saved').get('project');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function dbPut(data){return new Promise((resolve,reject)=>{const tx=db.transaction('saved','readwrite');tx.objectStore('saved').put(data,'project');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
function scheduleSave(){clearTimeout(saveTimer);$('saveState').textContent='儲存中…';saveTimer=setTimeout(async()=>{try{const raw=JSON.stringify({project,active});if(db)await dbPut(raw);else localStorage.setItem(DB,raw);$('saveState').textContent='✓ 已在本機暫存'}catch(e){console.warn(e);$('saveState').textContent='⚠ 暫存失敗';toast('裝置儲存空間不足，請先匯出 PDF')}} ,700)}
async function init(){try{db=await dbOpen();const old=await dbGet();if(old){const state=JSON.parse(old);if(Array.isArray(state.project?.slides)&&state.project.slides.length){project=state.project;active=clamp(state.active||0,0,project.slides.length-1)}}}catch(err){console.warn(err);try{const old=localStorage.getItem(DB);if(old){const state=JSON.parse(old);if(state.project?.slides?.length){project=state.project;active=clamp(state.active||0,0,project.slides.length-1)}}}catch(_){}}
 $('projectTitle').value=project.title;render();thumbnails();$('saveState').textContent='已就緒';}
window.addEventListener('resize',syncDimensions);window.addEventListener('orientationchange',()=>setTimeout(syncDimensions,200));window.addEventListener('keydown',e=>{if(e.key==='Escape'){$('layoutModal').classList.remove('show');blurEditor()}if(e.key==='Delete'&&document.activeElement?.tagName!=='INPUT'&&!document.activeElement?.isContentEditable&&object())$('deleteObjBtn').click()});init();
})();
